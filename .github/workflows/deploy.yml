name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Archive/package-lock.json

      # ---- Archived site -> https://shuoyuewu.com/old/ ----
      - name: Install archive dependencies
        working-directory: Archive
        run: npm ci

      - name: Build archive site
        working-directory: Archive
        run: npm run build

      # ---- Assemble the final site tree ----
      - name: Assemble site
        run: |
          mkdir -p site/old
          cp -R Archive/dist/. site/old/
          # Root is intentionally blank until the new site is built.
          cp site-root/index.html site/index.html
          cp site-root/404.html site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
